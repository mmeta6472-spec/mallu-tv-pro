name: Audit live TV streams

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/App.jsx'
      - '.github/workflows/stream-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe tools
        run: |
          python -m pip install requests
          command -v ffprobe || echo "ffprobe unavailable; HTTP and playlist checks will still run"

      - name: Audit all built-in channel streams
        run: |
          cat > /tmp/audit_streams.py <<'PY'
          import csv, json, re, subprocess, concurrent.futures, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          source = Path('src/App.jsx').read_text(encoding='utf-8')
          # Only inspect the seven built-in channel arrays, not remote playlist packs.
          names = ['malayalamChannels','englishChannels','englishMovieChannels','dramaCartoonChannels','tamilChannels','sportsChannels','hindiChannels']
          channels = []
          for name in names:
              start = source.find('const ' + name + ' = [')
              if start < 0:
                  continue
              start = source.find('[', start) + 1
              depth, quote, escaped, end = 1, None, False, start
              while end < len(source) and depth:
                  ch = source[end]
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\\\': escaped = True
                      elif ch == quote: quote = None
                  else:
                      if ch in ('"', "'", '`'): quote = ch
                      elif ch == '[': depth += 1
                      elif ch == ']': depth -= 1
                  end += 1
              body = source[start:end-1]
              for obj in re.findall(r'\{[^{}]*\}', body):
                  def field(key):
                      m = re.search(r'\b' + key + r'\s*:\s*([\'"])(.*?)\1', obj)
                      return m.group(2) if m else ''
                  channel_id, channel_name, url = field('id'), field('name'), field('url')
                  if channel_id and channel_name and url:
                      channels.append({'id':channel_id,'name':channel_name,'group':name,'url':url})

          headers = {'User-Agent':'Mozilla/5.0 (compatible; MALLUTVStreamAudit/1.0)', 'Accept':'*/*'}
          def probe(c):
              row = {**c, 'http_status':'', 'playlist':'', 'segment_status':'', 'codecs':'', 'result':'', 'details':''}
              try:
                  r = requests.get(c['url'], headers=headers, timeout=(5,9), allow_redirects=True)
                  row['http_status'] = r.status_code
                  if r.status_code < 200 or r.status_code >= 300:
                      row['result'] = 'HTTP_ERROR'
                      row['details'] = 'Source returned HTTP ' + str(r.status_code)
                      return row
                  body = r.text[:250000] if ('text' in r.headers.get('content-type','').lower() or c['url'].lower().split('?')[0].endswith(('.m3u8','.mpd','.m3u','.txt'))) else '')
                  if '#EXTM3U' in body:
                      row['playlist'] = 'HLS'
                      lines = [x.strip() for x in body.splitlines() if x.strip()]
                      variant = next((lines[i+1] for i,x in enumerate(lines[:-1]) if x.startswith('#EXT-X-STREAM-INF') and not lines[i+1].startswith('#')), None)
                      media_url = urljoin(r.url, variant) if variant else r.url
                      if variant:
                          vr = requests.get(media_url, headers=headers, timeout=(5,8), allow_redirects=True)
                          if vr.status_code < 200 or vr.status_code >= 300:
                              row['result'] = 'VARIANT_ERROR'
                              row['details'] = 'Master playlist OK, variant returned HTTP ' + str(vr.status_code)
                              return row
                          lines = [x.strip() for x in vr.text[:250000].splitlines() if x.strip()]
                          media_url = vr.url
                      segment = next((x for x in lines if not x.startswith('#') and urlparse(x).path), None)
                      if segment:
                          seg_url = urljoin(media_url, segment)
                          sr = requests.get(seg_url, headers=headers, timeout=(5,8), stream=True)
                          row['segment_status'] = sr.status_code
                          sr.close()
                          if sr.status_code < 200 or sr.status_code >= 300:
                              row['result'] = 'SEGMENT_ERROR'
                              row['details'] = 'Playlist reachable but first media segment returned HTTP ' + str(sr.status_code)
                              return row
                  elif '<MPD' in body or '<mpd' in body:
                      row['playlist'] = 'DASH'
                  elif c['url'].lower().split('?')[0].endswith(('.mp4','.webm','.flv','.ts')):
                      row['playlist'] = 'DIRECT_MEDIA'
                  else:
                      row['playlist'] = 'UNKNOWN_OR_DIRECT'
                  try:
                      p = subprocess.run(['ffprobe','-v','error','-rw_timeout','10000000','-read_intervals','%+4','-show_entries','stream=codec_name,codec_type,width,height','-of','json',c['url']], capture_output=True, text=True, timeout=14)
                      if p.returncode == 0:
                          info = json.loads(p.stdout or '{}')
                          streams = info.get('streams', [])
                          row['codecs'] = '; '.join((x.get('codec_type','?') + ':' + x.get('codec_name','?') + (('@'+str(x.get('width'))+'x'+str(x.get('height'))) if x.get('width') else '')) for x in streams)
                          row['result'] = 'OK' if streams else 'NO_MEDIA_STREAMS'
                          row['details'] = '' if streams else 'HTTP reachable, but ffprobe found no media streams'
                      else:
                          err = (p.stderr or '').strip().splitlines()
                          row['result'] = 'PROBE_INCONCLUSIVE'
                          row['details'] = (err[-1][:220] if err else 'ffprobe could not inspect media; may be geo/CORS/token/codec restricted')
                  except subprocess.TimeoutExpired:
                      row['result'] = 'PROBE_TIMEOUT'
                      row['details'] = 'Source responds, but media probe exceeded 14 seconds'
                  except FileNotFoundError:
                      row['result'] = 'PROBE_UNAVAILABLE'
                      row['details'] = 'ffprobe is unavailable; HTTP and playlist checks still apply'
              except requests.exceptions.Timeout:
                  row['result'] = 'TIMEOUT'
                  row['details'] = 'No HTTP response before timeout'
              except requests.exceptions.RequestException as e:
                  row['result'] = 'NETWORK_ERROR'
                  row['details'] = str(e)[:220]
              except Exception as e:
                  row['result'] = 'AUDIT_ERROR'
                  row['details'] = str(e)[:220]
              return row

          print('Built-in channel entries found:', len(channels))
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              results = list(pool.map(probe, channels))
          fields = ['id','name','group','url','http_status','playlist','segment_status','codecs','result','details']
          with open('stream-audit.csv','w',newline='',encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(results)
          summary = {}
          for row in results: summary[row['result']] = summary.get(row['result'],0)+1
          Path('stream-audit-summary.json').write_text(json.dumps({'channel_count':len(results),'summary':summary,'results':results},indent=2),encoding='utf-8')
          print('AUDIT SUMMARY:', json.dumps(summary, sort_keys=True))
          print('Full per-channel report saved to stream-audit.csv and stream-audit-summary.json')
          PY
          python /tmp/audit_streams.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mallu-tv-stream-audit
          path: |
            stream-audit.csv
            stream-audit-summary.json
          if-no-files-found: warn
          retention-days: 14
