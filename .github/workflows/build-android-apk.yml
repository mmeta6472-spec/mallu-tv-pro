name: Build MALLU TV PRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web app dependencies
        run: npm install

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Allow HTTP playlist streams in Android WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MALLU-TV-PRO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: MALLU TV PRO Android APK (latest)
          body: |
            Latest automatically built Android APK for MALLU TV PRO.
            This is a debug-signed APK for direct installation on Android.
            Android may ask you to allow installing apps from your browser.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
